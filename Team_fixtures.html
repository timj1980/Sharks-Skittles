<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tewkesbury Skittles League – Team Fixtures</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<h1>Tewkesbury Skittles League</h1>

<h1>Team Fixtures</h1>

<h2 id="TeamHeading"></h2>



<table id="fixturesTable">
  <thead>
    <tr>
      <th>Date</th>
      <th>Home/Away</th>
      <th>Alley</th>
      <th>Opposition</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script type="module">
  import { supabase } from "./supabase.js";

  // ⭐ Get team name from URL (?Sharks)
  const params = new URLSearchParams(window.location.search);
  const team = params.keys().next().value;

  // ⭐ Dynamic heading
  document.getElementById("TeamHeading").textContent = `${team} Fixtures`;

  async function loadFixtures(team) {
    const { data, error } = await supabase.rpc("get_fixtures_by_team", {
      team: team
    });

    if (error) {
      console.error("RPC Error:", error);
      return;
    }

    const tbody = document.querySelector("#fixturesTable tbody");
    tbody.innerHTML = "";

    data.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.game_date}</td>
        <td>${row.home_away}</td>
        <td>${row.alley}</td>
        <td>${row.opposition}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // ⭐ Load fixtures for the team passed in the URL
  loadFixtures(team);
</script>

</body>
</html>
