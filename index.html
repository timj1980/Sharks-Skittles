<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sharks Score Entry</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .step { display: none; }
    .step.active { display: block; }

    h2 { margin-top: 0; }

    label { display: block; margin-top: 10px; font-weight: bold; }

    input[type="text"], input[type="number"], input[type="date"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 1.1rem;
      box-sizing: border-box;
    }

    .player-block {
      margin-bottom: 25px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .balls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      font-size: 1.2rem;
      background: #0a7;
      color: white;
      border: none;
      border-radius: 8px;
    }

    .secondary {
      background: #555;
    }
  </style>
</head>
