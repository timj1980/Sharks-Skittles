<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sharks – Player Averages</title>

  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: Arial; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    th { background: #eee; }
  </style>
</head>

<body>

<div id="nav-placeholder"></div>

<script>
  fetch("Nav.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("nav-placeholder").innerHTML = html;
      initNav();
    });

  function initNav() {
    const page = window.location.pathname.split("/").pop().toLowerCase();
    document.querySelectorAll(".gh-tabs a").forEach(link => {
      const href = link.getAttribute("href").toLowerCase();
      if (href.includes(page)) link.classList.add("active");
    });
  }
</script>

<h1>Sharks – Player Averages</h1>

<table id="avgTable">
  <thead>
    <tr>
      <th>Player</th>
      <th>Games</th>
      <th>Highest Score</th>
      <th>Average</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script type="module">
  import { supabase } from "./supabase.js";

  async function loadAverages() {
    const { data: scores } = await supabase
      .from("Sharks_scores")
      .select("*")
      .order("GameDate", { ascending: true });

    const players = {};

    function addScore(player, balls) {
      const total = balls.reduce((a,b) => a+b, 0);
      if (!players[player]) players[player] = { games: 0, total: 0, highest: 0 };
      players[player].games += 1;
      players[player].total += total;
      if (total > players[player].highest) players[player].highest = total;
    }

    // ⭐ Robust date extractor — works with ANY GameDate format
    function extractSqlDate(gameDateText) {
      const match = gameDateText.match(/\d{1,2}-\d{1,2}-\d{4}/);
      if (!match) return null;
      const [day, month, year] = match[0].split("-");
      return `${year}-${month}-${day}`;
    }

    for (const row of scores) {
      const parsedDate = extractSqlDate(row.GameDate);
      if (!parsedDate) continue;

      const { data: fx } = await supabase.rpc("get_sharks_fixture", {
        game_date: parsedDate
      });

      if (!fx || fx.length === 0) continue;

      const fixture = fx.find(f =>
        f.home_team_name === "Sharks" || f.away_team_name === "Sharks"
      );

      if (!fixture) continue;

      const sharksHome = fixture.home_team_name === "Sharks";
      const sharksAway = fixture.away_team_name === "Sharks";

      if (sharksHome) {
        addScore(row.Home_Player, [
          row.HomeBall1, row.HomeBall2, row.HomeBall3, row.HomeBall4,
          row.HomeBall5, row.HomeBall6, row.HomeBall7, row.HomeBall8
        ]);
      }

      if (sharksAway) {
        addScore(row.Away_Player, [
          row.AwayBall1, row.AwayBall2, row.AwayBall3, row.AwayBall4,
          row.AwayBall5, row.AwayBall6, row.AwayBall7, row.AwayBall8
        ]);
      }
    }

    const tbody = document.querySelector("#avgTable tbody");
    tbody.innerHTML = "";

    const sortedPlayers = Object.entries(players)
      .sort((a, b) => (b[1].total / b[1].games) - (a[1].total / a[1].games));

    sortedPlayers.forEach(([player, stats]) => {
      const avg = (stats.total / stats.games).toFixed(2);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${player}</td>
        <td>${stats.games}</td>
        <td>${stats.highest}</td>
        <td>${avg}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  loadAverages();
</script>

</body>
</html>
